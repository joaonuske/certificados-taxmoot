<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Certificados — Tax Moot Brazil</title>
<style>
:root{--navy:#10233F;--gold:#B08D57;}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#1b1b1b;background:#f6f7f9}
header{background:var(--navy);color:#fff;text-align:center;padding:26px 16px}
header img{max-width:420px;width:70%;background:#fff;padding:10px 16px;border-radius:8px}
header h1{margin:14px 0 2px;font-size:20px;letter-spacing:.04em;font-weight:600}
header p{margin:0;color:#c9d3e0;font-size:13px}
.wrap{max-width:760px;margin:0 auto;padding:22px 16px 60px}
.searchbar{display:flex;gap:8px;margin:8px 0 18px}
input[type=text]{flex:1;padding:13px 14px;font-size:16px;border:1px solid #cfd6df;border-radius:8px}
button{padding:13px 20px;font-size:15px;font-weight:600;color:#fff;background:var(--navy);border:0;border-radius:8px;cursor:pointer}
button:hover{background:#183054}
.card{background:#fff;border:1px solid #e6e9ee;border-left:4px solid var(--gold);border-radius:8px;padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.card .nome{font-weight:600;font-size:16px;color:var(--navy)}
.card .meta{font-size:13px;color:#5a6472;margin-top:3px}
.baixar{white-space:nowrap;text-decoration:none;background:var(--gold);color:#fff;padding:9px 16px;border-radius:7px;font-size:14px;font-weight:600}
.msg{color:#5a6472;font-size:14px;padding:8px 2px}
.ok{background:#e8f6ec;border:1px solid #9fd8b0;border-left:5px solid #2e9e57;border-radius:8px;padding:18px}
.ok h2{margin:0 0 8px;color:#1f7a42}
.bad{background:#fdecec;border:1px solid #f0b4b4;border-left:5px solid #c0392b;border-radius:8px;padding:18px}
.bad h2{margin:0 0 6px;color:#a5281c}
.linha{font-size:14px;color:#33404f;margin:3px 0} .linha b{color:var(--navy)}
.foot{text-align:center;color:#9aa4b1;font-size:12px;margin-top:24px}
</style></head><body>

const norm=s=>(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();
const res=document.getElementById("res"), q=document.getElementById("q");
function render(){
  const t=norm(q.value);
  if(t.length<2){res.innerHTML='<div class="msg">Digite ao menos 2 letras do seu nome.</div>';return;}
  const achou=DADOS.filter(d=>d.b.indexOf(t)>=0).slice(0,200);
  if(!achou.length){res.innerHTML='<div class="msg">Nenhum certificado encontrado para \u201c'+q.value+'\u201d.</div>';return;}
  res.innerHTML=achou.map(d=>`<div class="card"><div><div class="nome">${d.n}</div>
    <div class="meta">${d.e} · ${d.p}${d.i?' — '+d.i:''}</div></div>
    <a class="baixar" href="${d.u}" target="_blank" rel="noopener">Baixar</a></div>`).join("");
}
q.addEventListener("input",render); q.addEventListener("keyup",e=>{if(e.key==="Enter")render();});
document.getElementById("btn").addEventListener("click",render);
</script>
