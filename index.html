<style>
:root{--navy:#10233F;--gold:#B08D57;--ink:#1b1b1b;}
*{box-sizing:border-box;}

  background:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;}
.card{max-width:620px;width:100%;margin:0 auto;padding:40px 22px 34px;text-align:center;}
.kick{letter-spacing:.34em;font-size:13px;color:var(--navy);text-transform:uppercase;font-weight:bold;}

.btn.primary{background:var(--navy);color:#fff;}
.btn.primary:hover{background:#1c3d6e;}

.btn.ghost:hover{background:#faf6ee;}
.note{margin-top:26px;font-size:13px;color:#999;line-height:1.5;}
.logos{margin-top:34px;}
.logos img{width:min(360px,86%);opacity:.95;}
@media(max-width:520px){.h1{font-size:28px;}.btn{min-width:100%;}}
