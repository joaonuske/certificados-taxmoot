<!doctype html>
<html lang="pt-br"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Certificados — Tax Moot CARF</title>
<style>
:root{--navy:#10233F;--gold:#B08D57;--ink:#1b1b1b;}
*{box-sizing:border-box;}
body{margin:0;font-family:Georgia,"Times New Roman",serif;color:var(--ink);
  background:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;}
.card{max-width:620px;width:100%;margin:0 auto;padding:40px 22px 34px;text-align:center;}
.kick{letter-spacing:.34em;font-size:13px;color:var(--navy);text-transform:uppercase;font-weight:bold;}
.h1{font-size:34px;color:var(--navy);margin:12px 0 6px;}
.sub{color:#666;font-size:16px;line-height:1.5;max-width:460px;margin:0 auto;}
.bar{width:82px;height:3px;background:var(--gold);margin:16px auto 30px;}
.actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:8px;}
.btn{display:inline-block;text-decoration:none;padding:16px 26px;border-radius:10px;font-size:16px;
  min-width:230px;transition:all .15s;}
.btn.primary{background:var(--navy);color:#fff;}
.btn.primary:hover{background:#1c3d6e;}
.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--gold);}
.btn.ghost:hover{background:#faf6ee;}
.note{margin-top:26px;font-size:13px;color:#999;line-height:1.5;}
.logos{margin-top:34px;}
.logos img{width:min(360px,86%);opacity:.95;}
@media(max-width:520px){.h1{font-size:28px;}.btn{min-width:100%;}}
</style></head>
<body>
  <div class="card">
    <div class="kick">Tax Moot CARF</div>
    <div class="h1">Certificados</div>
    <div class="sub">Portal oficial de certificados da competição. Encontre e baixe o seu, ou confira a autenticidade de um certificado.</div>
    <div class="bar"></div>
    <div class="actions">
      <a class="btn primary" href="busca_certificados.html">Buscar meu certificado</a>
      <a class="btn ghost" href="verificar.html">Verificar autenticidade</a>
    </div>
    <div class="note">Cada certificado possui um código único e um QR Code que direciona à página de verificação.</div>
    <div class="logos"><img src="logos_tax.png" alt="Tax Moot CARF"></div>
  </div>
</body></html>
