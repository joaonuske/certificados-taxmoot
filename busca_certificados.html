function norm(s){return (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();}
var q=document.getElementById("q"),res=document.getElementById("results"),hint=document.getElementById("hint"),go=document.getElementById("go");
function esc(s){return (s||"").replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function render(){
  var term=norm(q.value);
  if(term.length<2){res.innerHTML="";hint.style.display="block";return;}
  hint.style.display="none";
  var hits=DATA.filter(function(d){return d.b.indexOf(term)>=0;});
  if(!hits.length){res.innerHTML='<div class="empty">Nenhum certificado encontrado para "'+esc(q.value)+'".<br>Confira a grafia ou tente só o primeiro nome.</div>';return;}
  hits.sort(function(a,b){return a.n.localeCompare(b.n,"pt")||a.e.localeCompare(b.e);});
  var h='<div class="count">'+hits.length+(hits.length>1?" certificados encontrados":" certificado encontrado")+'</div>';
  for(var i=0;i<hits.length;i++){var d=hits[i];

       '<a class="btn" href="'+encodeURI(d.u)+'" target="_blank" rel="noopener">Baixar certificado</a></div>';
  }
  res.innerHTML=h;
}
